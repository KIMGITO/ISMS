name: Notify Slack
description: >
  Posts a message to the developer's Slack channel through an incoming webhook
  (the SLACK_WEBHOOK_URL repository secret). Never fails the job: a missing webhook
  or a Slack outage only leaves a warning.

inputs:
  webhook:
    description: The incoming webhook URL (pass secrets.SLACK_WEBHOOK_URL)
    required: false
    default: ""
  status:
    description: success, failure, warning or info. Picks the icon.
    required: true
  title:
    description: First line, in bold
    required: true
  details:
    description: Further lines (Slack mrkdwn)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        WEBHOOK: ${{ inputs.webhook }}
        STATUS: ${{ inputs.status }}
        TITLE: ${{ inputs.title }}
        DETAILS: ${{ inputs.details }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        COMMIT: ${{ github.sha }}
        ACTOR: ${{ github.actor }}
        WORKFLOW: ${{ github.workflow }}
      run: |
        if [ -z "$WEBHOOK" ]; then
          echo "::warning::SLACK_WEBHOOK_URL is not set, so Slack was not told: $TITLE"
          exit 0
        fi
        case "$STATUS" in
          success) icon=":white_check_mark:" ;;
          failure) icon=":red_circle:" ;;
          warning) icon=":warning:" ;;
          *)       icon=":information_source:" ;;
        esac
        subject=$(git log -1 --format=%s "$COMMIT" 2>/dev/null || true)
        payload=$(jq -n \
          --arg text "$icon *$TITLE*" \
          --arg details "$DETAILS" \
          --arg context "$WORKFLOW · ${COMMIT:0:7}${subject:+ $subject} · by $ACTOR" \
          --arg url "$RUN_URL" \
          '{
            text: $text,
            blocks: ([
              {type: "section", text: {type: "mrkdwn", text: $text}}
            ] + (if $details == "" then [] else [{type: "section", text: {type: "mrkdwn", text: $details}}] end) + [
              {type: "context", elements: [{type: "mrkdwn", text: ($context | gsub("[<>&]"; "")) }]},
              {type: "actions", elements: [{type: "button", text: {type: "plain_text", text: "Open the run"}, url: $url}]}
            ])
          }')
        curl -fsS --retry 3 --max-time 15 -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK" >/dev/null \
          || echo "::warning::Couldn't post to Slack: $TITLE"
