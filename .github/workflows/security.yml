name: Security checks

# Phase 6: known-vulnerable dependencies and committed secrets fail the check.
# Runs on every pull request to main, and every Monday so new advisories against packages
# that haven't changed are still noticed. On pushes to main, release-and-deploy.yml calls it
# before releasing (Phase 7), so a failure blocks the release and that run alerts Telegram.
on:
  pull_request:
    branches: [main]
  workflow_call:
  schedule:
    - cron: "0 5 * * 1" # Monday 08:00 Nairobi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit (npm + Rust)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # High and critical only; moderate ones are reviewed with the weekly update PRs.
      - name: npm audit (app, website and build tools)
        run: npm audit --audit-level=high
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (desktop app)
        working-directory: src-tauri
        # Warnings (unmaintained crates pulled in by Tauri) are printed, not failed on.
        run: cargo audit

  secrets:
    name: Secret scan (gitleaks, whole history)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan
        run: gitleaks git --redact --no-banner --config .gitleaks.toml .

  edge-function-tests:
    name: Edge function guard tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # --no-config: edge functions run without the app's package.json (CI has no node_modules).
      - run: deno test --allow-env --no-config supabase/tests/functions/

  alert:
    name: Tell Telegram
    needs: [dependencies, secrets, edge-function-tests]
    # Only the Monday and manual runs; a release run reports its own failures.
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - name: Send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && { echo "Telegram secrets not set"; exit 0; }
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Security checks failed on ${GITHUB_REF_NAME}: a vulnerable dependency or a committed secret. ${RUN_URL}" >/dev/null
