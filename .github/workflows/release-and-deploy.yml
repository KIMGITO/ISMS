name: Release and Deploy

# Every push to main works out a version from its commits. If one is due, the app is
# tested and built for Windows, Linux and Android, and only then is the tag pushed and
# the release published. A failed test or build stops the run before any tag exists.
#
# Installed apps update themselves from the release's latest.json (see src/core/native/UpdateService.ts).
# latest.json is also pushed to the "update-manifest" branch, because GitHub's
# releases/latest/download link lags behind new releases and sometimes answers 504.
# The last step downloads it the way apps do and fails the run if apps couldn't update.
#
# Commit rules (see scripts/release-version.mjs; emoji and scope are optional):
#   MAJOR  🚀 feat!: / 🐛 fix!: (any type followed by "!"), or "BREAKING CHANGE" in the body
#   MINOR  🚀 feat:
#   PATCH  🐛 fix:  ⚡ perf:  ♻️ refactor:
#   NONE   🚧 wip:  📚 docs:  🎨 style:  ✅ test:  🔧 chore:  📦 build:  🤖 ci:  ⏪ revert:

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Releases run one at a time, so two pushes can't claim the same version.
concurrency:
  group: release-and-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # ── PLACEHOLDERS: your app's commands ───────────────────────────────────────
  INSTALL_COMMAND: "npm ci"
  TEST_COMMAND: "npm run lint && npm test"
  # Tauri builds the frontend itself through beforeBuildCommand in tauri.conf.json.
  # Other stacks: "cargo build --release", "go build -o dist/app.exe ./cmd/app",
  # "dotnet publish -c Release -r win-x64 --self-contained", "npx electron-builder --win".
  WINDOWS_BUILD_COMMAND: "npx tauri build --bundles msi"
  LINUX_BUILD_COMMAND: "npx tauri build --bundles appimage,deb"
  # Where the builds land.
  EXE_PATH: "src-tauri/target/release/app.exe"
  MSI_GLOB: "src-tauri/target/release/bundle/msi/*.msi"
  APPIMAGE_GLOB: "src-tauri/target/release/bundle/appimage/*.AppImage"
  DEB_GLOB: "src-tauri/target/release/bundle/deb/*.deb"
  RELEASE_NAME_PREFIX: "KayKays"
  # ────────────────────────────────────────────────────────────────────────────
  # Build-time settings the app reads.
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
  VITE_AI_NAME: ${{ secrets.VITE_AI_NAME || 'Kim' }}
  VITE_UNSPLASH_ACCESS_KEY: ${{ secrets.VITE_UNSPLASH_ACCESS_KEY }}

jobs:
  # ──────────────────────────────────────────
  # 1. Work out the version (nothing is written yet)
  # ──────────────────────────────────────────
  version:
    name: Calculate version
    runs-on: ubuntu-24.04
    outputs:
      bump: ${{ steps.calc.outputs.bump }}
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      previous: ${{ steps.calc.outputs.previous }}
      # Android refuses an update whose code isn't higher than the installed one.
      # Local builds use a timestamp code (under 10,000,000 until the 2040s), so releases always win.
      android_code: ${{ steps.code.outputs.android_code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history and tags, to find the last release

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Read commits since the last tag
        id: calc
        env:
          RELEASE_NOTES_FILE: release-notes.md
        run: node scripts/release-version.mjs

      - name: Android version code
        id: code
        env:
          VERSION: ${{ steps.calc.outputs.version }}
        run: |
          IFS=. read -r major minor patch <<< "$VERSION"
          echo "android_code=$((10000000 + major * 100000 + minor * 1000 + patch))" >> "$GITHUB_OUTPUT"

      - name: Check required secrets
        if: steps.calc.outputs.bump != 'none'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=""
          [ -z "$VITE_SUPABASE_URL" ] && missing="$missing VITE_SUPABASE_URL"
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && missing="$missing VITE_SUPABASE_ANON_KEY"
          [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] && missing="$missing TAURI_SIGNING_PRIVATE_KEY"
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::Set these repository secrets:$missing"
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "### Version"
            echo ""
            echo "Previous: \`${{ steps.calc.outputs.previous || 'none' }}\`  Bump: **${{ steps.calc.outputs.bump }}**  Next: \`${{ steps.calc.outputs.tag }}\`"
            echo ""
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: steps.calc.outputs.bump != 'none'
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  # ──────────────────────────────────────────
  # 2a. Test, then build Windows (.exe and signed .msi)
  # ──────────────────────────────────────────
  build-windows:
    name: Test and build Windows
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Desktop apps refuse an update that isn't signed with this key.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # ── Remove these two steps if you don't build with Rust/Tauri ──
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install dependencies
        run: eval "$INSTALL_COMMAND"

      # Runs before the slow compile, so a broken change fails fast.
      - name: Run tests
        run: eval "$TEST_COMMAND"

      - name: Stamp version ${{ env.VERSION }}
        run: node scripts/stamp-version.mjs "$VERSION"

      # The Rust cache restores src-tauri/target, including the last release's installers.
      # Without this, the old and new installers are both found.
      - name: Clear installers from earlier builds
        run: rm -rf src-tauri/target/release/bundle

      - name: Build
        run: eval "$WINDOWS_BUILD_COMMAND"

      - name: Check and collect the build
        run: |
          set -euo pipefail
          mkdir -p out
          if [ ! -f "$EXE_PATH" ]; then
            echo "::error::No executable at $EXE_PATH. Update EXE_PATH in the workflow."
            exit 1
          fi
          # Every Windows executable starts with "MZ"; anything else is a broken build.
          if [ "$(head -c 2 "$EXE_PATH")" != "MZ" ]; then
            echo "::error::$EXE_PATH is not a Windows executable."
            exit 1
          fi
          cp "$EXE_PATH" "out/${RELEASE_NAME_PREFIX}-${VERSION}-windows-x64.exe"
          shopt -s nullglob
          msis=($MSI_GLOB)
          if [ ${#msis[@]} -eq 0 ]; then
            echo "::error::No .msi found in $MSI_GLOB."
            exit 1
          fi
          # Prefer an x64 MSI if multiple are produced.
          msi=""
          for m in "${msis[@]}"; do
            if [[ "$m" == *x64* ]]; then msi="$m"; break; fi
          done
          [ -z "$msi" ] && msi="${msis[0]}"
          if [ ! -f "$msi.sig" ]; then
            echo "::error::$msi has no .sig, so installed apps would refuse it. Is TAURI_SIGNING_PRIVATE_KEY set?"
            exit 1
          fi
          cp "$msi" "out/${RELEASE_NAME_PREFIX}-${VERSION}-windows-x64-setup.msi"
          cp "$msi.sig" "out/${RELEASE_NAME_PREFIX}-${VERSION}-windows-x64-setup.msi.sig"
          ls -l out

      - uses: actions/upload-artifact@v6
        with:
          name: build-windows
          path: out/*
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────
  # 2b. Build Linux (signed AppImage, and .deb)
  # ──────────────────────────────────────────
  build-linux:
    name: Build Linux
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Desktop apps refuse an update that isn't signed with this key.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        # The script retries stalled downloads; this only stops a run that can't recover.
        timeout-minutes: 30
        run: bash scripts/install-linux-deps.sh

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-

      - run: eval "$INSTALL_COMMAND"
      - run: node scripts/stamp-version.mjs "$VERSION"
      # The Rust cache restores src-tauri/target, including the last release's installers.
      # Without this, the old and new installers are both found.
      - name: Clear installers from earlier builds
        run: rm -rf src-tauri/target/release/bundle

      - name: Build
        run: eval "$LINUX_BUILD_COMMAND"

      - name: Collect the build
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p out
          images=($APPIMAGE_GLOB)
          if [ ${#images[@]} -ne 1 ] || [ ! -f "${images[0]}.sig" ]; then
            echo "::error::Expected one .AppImage and its .sig, found ${#images[@]}. Is TAURI_SIGNING_PRIVATE_KEY set?"
            exit 1
          fi
          cp "${images[0]}" "out/${RELEASE_NAME_PREFIX}-${VERSION}-linux-x86_64.AppImage"
          cp "${images[0]}.sig" "out/${RELEASE_NAME_PREFIX}-${VERSION}-linux-x86_64.AppImage.sig"
          # Apps installed from the .deb update from the .deb, so it needs its signature too.
          debs=($DEB_GLOB)
          if [ ${#debs[@]} -ne 1 ] || [ ! -f "${debs[0]}.sig" ]; then
            echo "::error::Expected one .deb and its .sig, found ${#debs[@]}."
            exit 1
          fi
          cp "${debs[0]}" "out/${RELEASE_NAME_PREFIX}-${VERSION}-linux-amd64.deb"
          cp "${debs[0]}.sig" "out/${RELEASE_NAME_PREFIX}-${VERSION}-linux-amd64.deb.sig"
          ls -l out

      - uses: actions/upload-artifact@v6
        with:
          name: build-linux
          path: out/*
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────
  # 2c. Build Android (signed APK)
  # ──────────────────────────────────────────
  build-android:
    name: Build Android
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      # Capacitor 8 requires JDK 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          # Also keeps Gradle itself, so a GitHub download hiccup can't break the build.
          cache: gradle

      - uses: android-actions/setup-android@v4
        # The default list includes "tools", which Google removed; that fails on current runners.
        with:
          packages: platform-tools

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: eval "$INSTALL_COMMAND"
      - run: node scripts/stamp-version.mjs "$VERSION"
      - run: npm run build

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Without it the APK silently has no push at all: no notifications, and reminders
          # set on other phones never reach this one. So a build without it must not ship.
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::The GOOGLE_SERVICES_JSON secret is not set. Add it (gh secret set GOOGLE_SERVICES_JSON < android/app/google-services.json); without it the app gets no push notifications."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          node -e "const j=JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8')); if(!j.client.some(c=>c.client_info.android_client_info.package_name==='com.kaykays.app')){console.error('::error::google-services.json has no com.kaykays.app client');process.exit(1)}"

      # Every release must be signed with the same key, or Android refuses the update.
      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: npx cap sync android

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ env.VERSION }}
          ANDROID_VERSION_CODE: ${{ needs.version.outputs.android_code }}
        run: |
          cd android
          chmod +x gradlew
          # Gradle and its plugins are downloaded from GitHub and Maven, which sometimes
          # answer 502/504 for a minute. Retry instead of failing the release.
          for attempt in 1 2 3; do
            ./gradlew assembleRelease && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "::warning::Gradle build failed (attempt $attempt of 3), retrying in 30s."
            sleep 30
          done

      - name: Collect the APK
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p out
          apks=(android/app/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -ne 1 ]; then
            echo "::error::Expected one release APK, found ${#apks[@]}."
            exit 1
          fi
          # AGP signs the release APK in place but keeps the "-unsigned" filename,
          # so the keystore env var (which gates signingConfig in build.gradle)
          # is the source of truth for whether the APK is signed.
          if [ -z "${ANDROID_KEYSTORE_PATH:-}" ] || [ ! -f "${ANDROID_KEYSTORE_PATH}" ]; then
            echo "::error::No signing keystore configured, so the APK is unsigned and can't update installed apps. Set ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          # Verify the signature, and that it's made with the same key as every earlier
          # release. Android refuses an update signed with a different key ("App not
          # installed"), so a swapped keystore secret would strand every installed phone.
          apksigner=$(command -v apksigner || ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found, so the APK's signing key can't be checked."
            exit 1
          fi
          certs=$("$apksigner" verify --print-certs "${apks[0]}") \
            || { echo "::error::APK signature verification failed."; exit 1; }
          # apksigner versions label the line differently ("Signer #1", "Signer (minSdkVersion=…)").
          actual=$(echo "$certs" | sed -n 's/.*certificate SHA-256 digest: *//p' | head -1 | tr -d ' \r')
          expected=$(tr -d ' \n\r' < android/release-signing-cert.sha256)
          echo "APK signing certificate SHA-256: $actual"
          if [ -z "$actual" ]; then
            echo "::error::Couldn't read the signing certificate from apksigner. Its output was:"
            echo "$certs"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::The APK is signed with certificate $actual, but installed apps expect $expected (android/release-signing-cert.sha256). ANDROID_KEYSTORE_BASE64 holds a different keystore; restore the original one. Change the pinned value only if you accept that every phone must uninstall and reinstall."
            exit 1
          fi
          cp "${apks[0]}" "out/${RELEASE_NAME_PREFIX}-${VERSION}-android.apk"
          ls -l out

      - uses: actions/upload-artifact@v6
        with:
          name: build-android
          path: out/*
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────
  # 2d. Build the customer website (website/, kaykays.com)
  # ──────────────────────────────────────────
  # Built with every app release, so the website and the app always ship against the
  # same database changes. A broken website stops the release like a broken app build.
  # The built site is kept as the "website-dist" artifact of the run.
  build-website:
    name: Build customer website
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-24.04
    env:
      VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
      VITE_WEBSITE_SLUG: ${{ secrets.VITE_WEBSITE_SLUG || 'kaykays' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: eval "$INSTALL_COMMAND"
      - name: Type check
        run: npm run website:lint
      # Also writes a page per product, guide and policy from the live storefront.
      - name: Build
        run: npm run website:build
      - name: Check the build
        run: |
          set -euo pipefail
          for page in index.html 404.html robots.txt; do
            [ -f "website/dist/$page" ] || { echo "::error::website/dist/$page is missing from the build."; exit 1; }
          done
          if [ -z "$VITE_SITE_URL" ]; then
            echo "::warning::VITE_SITE_URL is not set, so this build asks search engines not to index the site."
          fi
          echo "Website pages built: $(find website/dist -name index.html | wc -l)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: website-dist
          path: website/dist
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────
  # 3. Tag and publish (only reached when every build succeeded)
  # ──────────────────────────────────────────
  release:
    name: Tag and publish ${{ needs.version.outputs.tag }}
    needs: [version, build-windows, build-linux, build-android, build-website]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the tag and create the release
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      # RELEASE_TOKEN is optional; see the setup notes. Without it the built-in token is used.
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      # The public repo installed apps update from. Set the Actions variable RELEASES_REPO
      # (e.g. KIMGITO/kaykays-releases) to move releases out of this repo; see docs/GOING_PRIVATE.md.
      PUBLIC_REPO: ${{ vars.RELEASES_REPO || github.repository }}
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v7
        with:
          pattern: build-*
          path: out
          merge-multiple: true

      - uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: notes

      # Installed apps read this to find, verify and download the new version.
      # Download links point at PUBLIC_REPO, where the installers are published.
      - name: Write latest.json
        run: |
          node scripts/update-manifest.mjs \
            --version "$VERSION" --tag "$TAG" --repo "$PUBLIC_REPO" \
            --notes notes/release-notes.md --dir out > out/latest.json
          cat out/latest.json
          # The licence terms go out with every release, next to the installers.
          cp LICENSE out/LICENSE.txt
          (cd out && sha256sum $(ls | grep -v '\.sig$') > SHA256SUMS.txt)

      # Where this release goes: PUBLIC_REPO always, and this code repo too while it is still
      # public, so apps built before the move (which only know this repo) find the update
      # that teaches them the new address. Once this repo is private it is skipped by itself.
      - name: Choose where to publish
        run: |
          set -euo pipefail
          targets="$PUBLIC_REPO"
          if [ "$PUBLIC_REPO" != "$GITHUB_REPOSITORY" ]; then
            if [ "$HAS_RELEASE_TOKEN" != "true" ]; then
              echo "::error::RELEASES_REPO is $PUBLIC_REPO, so the RELEASE_TOKEN secret is needed (a token that can write to both repos). See docs/GOING_PRIVATE.md."
              exit 1
            fi
            if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = "false" ]; then
              targets="$targets $GITHUB_REPOSITORY"
            fi
          fi
          echo "Publishing to: $targets"
          echo "TARGETS=$targets" >> "$GITHUB_ENV"

      - name: Push tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # A re-run of a release that failed half way: fine if the tag is on this commit.
            tagged=$(git rev-list -n 1 "refs/tags/$TAG")
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already exists on another commit ($tagged). Was this version released already?"
              exit 1
            fi
            echo "$TAG already points at this commit; continuing."
          else
            git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      # gh uploads everything to a draft and only then publishes it, so apps never see a
      # half-uploaded release. Uploads to GitHub sometimes fail with 5xx; retry them.
      # In the releases repo (no code there) gh makes the tag on its default branch.
      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          for repo in $TARGETS; do
            verify=""
            [ "$repo" = "$GITHUB_REPOSITORY" ] && verify="--verify-tag"
            for attempt in 1 2 3 4; do
              if gh release view "$TAG" --repo "$repo" >/dev/null 2>&1; then
                gh release upload "$TAG" out/* --repo "$repo" --clobber \
                  && gh release edit "$TAG" --repo "$repo" --draft=false --latest \
                  && break
              else
                gh release create "$TAG" out/* \
                  --repo "$repo" \
                  --title "$TAG" \
                  --notes-file notes/release-notes.md \
                  $verify \
                  --latest \
                  && break
              fi
              if [ "$attempt" = 4 ]; then exit 1; fi
              echo "::warning::Publishing to $repo failed (attempt $attempt of 4), retrying in 20s."
              sleep 20
            done
            latest=$(gh api "repos/$repo/releases/latest" --jq .tag_name)
            if [ "$latest" != "$TAG" ]; then
              echo "::error::GitHub reports $latest as the latest release of $repo, not $TAG."
              exit 1
            fi
          done

      # Apps read this branch first (MANIFEST_SOURCES in src/core/native/updateManifest.ts).
      # A one-commit branch with no history, so it stays tiny. It also carries logo.png,
      # which emails link to (send-email), since the code repo may be private.
      - name: Publish latest.json to the update-manifest branch
        run: |
          set -euo pipefail
          blob=$(git hash-object -w out/latest.json)
          logo=$(git hash-object -w public/logo.png)
          tree=$(printf '100644 blob %s\tlatest.json\n100644 blob %s\tlogo.png\n' "$blob" "$logo" | git mktree)
          commit=$(git commit-tree "$tree" -m "latest.json for $TAG")
          for repo in $TARGETS; do
            for attempt in 1 2 3; do
              git push --force "https://github.com/$repo.git" "$commit:refs/heads/update-manifest" && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 10
            done
            # jsDelivr caches branches for hours; ask it to fetch the new file now.
            curl -fsS --retry 3 "https://purge.jsdelivr.net/gh/$repo@update-manifest/latest.json" >/dev/null \
              || echo "::warning::Couldn't refresh jsDelivr's copy for $repo; it catches up on its own within 12 hours."
          done
          echo "MANIFEST_COMMIT=$commit" >> "$GITHUB_ENV"

      # Downloads latest.json and every installer the way installed apps do. If this fails,
      # apps can't update even though the release exists.
      - name: Check that installed apps can update
        run: |
          node scripts/verify-update-manifest.mjs --version "$VERSION" \
            --require "https://raw.githubusercontent.com/$PUBLIC_REPO/$MANIFEST_COMMIT/latest.json" \
            --require "https://github.com/$PUBLIC_REPO/releases/download/$TAG/latest.json" \
            --warn "https://raw.githubusercontent.com/$PUBLIC_REPO/update-manifest/latest.json" \
            --warn "https://cdn.jsdelivr.net/gh/$PUBLIC_REPO@update-manifest/latest.json" \
            --warn "https://github.com/$PUBLIC_REPO/releases/latest/download/latest.json"

      # ── PLACEHOLDER: deploy ─────────────────────────────────────────────────
