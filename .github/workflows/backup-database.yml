name: Back up database

# Every hour: a full dump of the Supabase database (roles, schema, data), checked, encrypted
# and stored in Cloudflare R2 (private bucket, outside GitHub). At most about an hour of data
# can be lost. Copies are kept in tiers:
#   hourly/   every hour            kept 3 days
#   daily/    the 03:xx Nairobi run kept 35 days
#   weekly/   Sunday's daily        kept 6 months
#   monthly/  the 1st's daily       kept 13 months
# Without the R2 secrets the copy is kept as a run artifact instead (hourly 3 days, daily 14,
# Sunday 90). The whole plan, and how to restore, is in docs/BACKUP_AND_RECOVERY.md; the
# developer's tool is scripts/db-backup.sh.
#
# Secrets:
#   SUPABASE_DB_URL       Session pooler connection string (Supabase → Connect → Session pooler).
#                         Not the direct one: GitHub runners have no IPv6.
#   BACKUP_PASSPHRASE     Long random passphrase. Keep a copy offline: without it no backup opens.
#   R2_ACCESS_KEY_ID      Cloudflare R2 API token with Object Read & Write on the backup bucket.
#   R2_SECRET_ACCESS_KEY
#   CLOUDFLARE_ACCOUNT_ID (already set for web deploys)
# Variable (optional): BACKUP_BUCKET, default kaykays-backups.

on:
  schedule:
    - cron: "17 * * * *" # every hour at :17 (busy :00 slots get delayed on GitHub)
  workflow_dispatch:
    inputs:
      tier:
        description: "Also keep this copy as (e.g. before a risky migration: monthly keeps it 13 months)"
        type: choice
        options: [hourly, daily, weekly, monthly]
        default: hourly

permissions:
  contents: read
  actions: read # to look at the previous run, so a long outage sends one alert, not one an hour

concurrency:
  group: backup-database
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, check, encrypt, store
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET || 'kaykays-backups' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check settings
        run: |
          missing=""
          [ -z "$SUPABASE_DB_URL" ] && missing="$missing SUPABASE_DB_URL"
          [ -z "$BACKUP_PASSPHRASE" ] && missing="$missing BACKUP_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error::Set these repository secrets:$missing (see docs/BACKUP_AND_RECOVERY.md)"
            exit 1
          fi
          if [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "STORE=r2" >> "$GITHUB_ENV"
          else
            echo "::warning::R2 secrets not set: keeping this backup as a run artifact. This repository is public, so set up R2 (docs/BACKUP_AND_RECOVERY.md 4.1)."
            echo "STORE=artifact" >> "$GITHUB_ENV"
          fi

      - name: Pick tiers
        env:
          ASKED: ${{ inputs.tier }}
        run: |
          tiers="hourly"
          # The run in the 00:xx UTC hour (03:xx Nairobi) is the day's copy.
          if [ "$(date -u +%H)" = 00 ]; then
            tiers="$tiers daily"
            [ "$(date -u +%u)" = 7 ] && tiers="$tiers weekly"
            [ "$(date -u +%d)" = 01 ] && tiers="$tiers monthly"
          fi
          case "$ASKED" in daily|weekly|monthly) [[ " $tiers " == *" $ASKED "* ]] || tiers="$tiers $ASKED" ;; esac
          echo "TIERS=$tiers" >> "$GITHUB_ENV"
          # Artifact fallback: one copy, kept as long as its longest tier allows.
          keep=3
          [[ " $tiers " == *" daily "* ]] && keep=14
          [[ " $tiers " == *" weekly "* || " $tiers " == *" monthly "* ]] && keep=90
          echo "KEEP_DAYS=$keep" >> "$GITHUB_ENV"
          echo "Tiers: $tiers"

      # The CLI runs pg_dump in a container that matches the database's Postgres version.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0

      - name: Dump, check and encrypt
        run: |
          set -euo pipefail
          name="$(scripts/db-backup.sh make out)"
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "SIZE=$(stat -c %s "out/$name.tar.gz.gpg")" >> "$GITHUB_ENV"
          ls -l out

      - name: Store in R2
        if: env.STORE == 'r2'
        run: |
          set -euo pipefail
          scripts/db-backup.sh upload "out/$NAME.tar.gz.gpg" $TIERS
          scripts/db-backup.sh prune

      - name: Keep as artifact
        if: env.STORE == 'artifact'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: |
            out/${{ env.NAME }}.tar.gz.gpg
            out/${{ env.NAME }}.sha256
          if-no-files-found: error
          retention-days: ${{ env.KEEP_DAYS }}
          compression-level: 0 # already compressed and encrypted

      # This repository is public: the summary says only that it worked, never what is in it.
      - name: Summary
        run: |
          echo "### Database backup $NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Encrypted $(numfmt --to=iec "$SIZE"), stored in $STORE as: $TIERS." >> "$GITHUB_STEP_SUMMARY"

      # One alert when backups start failing, then one a day while they still fail.
      - name: Should we alert?
        id: alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh run list --workflow backup-database.yml --repo "$GITHUB_REPOSITORY" --status completed \
            --limit 1 --json conclusion --jq '.[0].conclusion' 2>/dev/null || echo unknown)"
          if [ "$previous" != failure ] || [ "$(date -u +%H)" = 00 ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tell Telegram
        if: failure() && steps.alert.outputs.send == 'true'
        uses: ./.github/actions/telegram-notify
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: failure
          title: Database backup failed
          details: "The hourly database backup did not complete, so every hour from now adds to what could be lost. Open the run and fix it, then run *Back up database* by hand. You hear again once a day while it keeps failing."
