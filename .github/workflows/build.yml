name: Build App Installers

# Pull requests are checked and built for Windows, Linux and Android before merging.
# Pushes to main build only the Android APK. Windows builds and GitHub Releases come
# from release-and-deploy.yml. A manual run builds everything.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  VITE_AI_NAME: ${{ secrets.VITE_AI_NAME || 'Kim' }}
  VITE_UNSPLASH_ACCESS_KEY: ${{ secrets.VITE_UNSPLASH_ACCESS_KEY }}

jobs:
  # ──────────────────────────────────────────
  # JOB 1: CHECKS (everything below depends on it)
  # ──────────────────────────────────────────
  verify:
    name: Type check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Pull requests from forks get no secrets, so only real builds insist on them.
      - name: Refuse to build an installer that cannot connect
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi

  # ──────────────────────────────────────────
  # JOB 2: DESKTOP BUILDS (Windows & Linux)
  # ──────────────────────────────────────────
  # On main, release-and-deploy.yml builds and publishes Windows instead.
  build-desktop:
    name: Build Desktop (${{ matrix.os-name }})
    needs: verify
    if: github.event_name != 'push'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os-name: Windows
            # The NSIS .exe compiler is broken on this runner image, so Windows ships an MSI.
            bundles: msi
          - runner: ubuntu-22.04
            os-name: Linux
            bundles: appimage,deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os-name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            build-essential \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install NPM dependencies
        run: npm ci

      # Tauri builds the frontend itself through beforeBuildCommand.
      # Checks don't need signed update files, so they build without the signing key.
      - name: Build Tauri Desktop
        run: npx tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.unsigned.conf.json

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-Artifacts-${{ matrix.os-name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────
  # JOB 3: ANDROID (APK) BUILD
  # ──────────────────────────────────────────
  build-android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Capacitor 8 requires JDK 21.
      - name: Setup Java (Temurin JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON is not set, so this build has no push notifications."
          fi

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64 repository secret."
            exit 1
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android Release APK
        env:
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_VERSION_NAME: "1.0"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Android-Artifacts
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
