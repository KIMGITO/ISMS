[package]
name = "app"
version = "0.1.0"
description = "ISMS Business Management System (KayKay's). Commercial software, see LICENSE."
authors = ["Dennis Kimanthi Gitonga <kimanthidennis02@gmail.com>"]
license-file = "../LICENSE"
publish = false
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
# Native background removal (bg_removal.rs). Downloads a prebuilt ONNX Runtime at build time.
ort = "=2.0.0-rc.15"
sha2 = "0.10"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
